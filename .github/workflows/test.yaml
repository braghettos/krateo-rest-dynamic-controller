# Canonical Krateo COMPONENT test suite — the SINGLE definition of "the tests pass", called by
# every trigger that needs it rather than copied into each one. Identical byte-for-byte across all
# component repos, like release-tag.yaml.
#
# Triggers:
#   • push to main   — direct pushes used to run nothing at all, so anything landing outside a PR
#                      was released untested (see the note below)
#   • workflow_call  — release-pullrequest.yaml (per-PR) and release-tag.yaml (gating the release)
#
# Why this file exists: tests used to run on `pull_request` only. release-tag.yaml had no test step,
# so a tag could publish an image that failed its own suite, and a push straight to main was
# released with zero CI. rest-dynamic-controller 0.16.0 and 0.16.1 shipped that way — including a
# regression test written the same day that had never executed in CI.
#
# -tags=unit,integration is deliberate: the envtest/kind suite in internal/controllers is only
# compiled under the `integration` tag, and dropping it silently skips those tests rather than
# failing. -p 1 keeps packages that stand up clusters from racing each other.
name: test

on:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gather dependencies
        run: go mod download
      - name: Run coverage
        run: go test -race -tags=unit,integration -p 1 -coverprofile=coverage.txt -timeout 20m -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
